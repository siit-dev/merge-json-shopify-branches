name: Merge Shopify JSON files from 2 branches

description: 'Merge Shopify JSON files from 2 branches'

author: 'SmartImpact IT'

inputs:
  json-paths:
    required: false
    description: 'JSON paths to merge'
    default: 'config/*.json,locales/*.json,templates/**/*.json,sections/**/*.json'
  main-branch:
    required: false
    description: 'Main branch'
    default: 'main'
  production-branch:
    required: false
    description: 'Production branch'
    default: 'production'
  live-mirror-branch:
    required: false
    description: 'Live mirror branch'
    default: 'live-mirror'
  check-json-validity:
    required: false
    description: 'Check JSON validity'
    default: 'true'
  formatter-command:
    required: false
    description: 'Formatter command'
  commit-message:
    required: false
    description: 'Commit message'
    default: '[AUTOMATED] Update JSON files from `#liveMirror#` branch: #files#'
  push-after-commit:
    required: false
    description: 'Push after commit'
    default: 'true'
  preferred:
    required: false
    description: 'Preferred merge strategy'
    default: 'theirs'
  exit-if-no-existing-deployment:
    required: false
    description: 'Exit if no existing deployment'
    default: 'true'
  run-locally-only:
    required: false
    description: 'Run locally only'
    default: 'true'
  config-git-user:
    required: false
    description: 'Configure git user'
    default: 'true'
  verbose:
    required: false
    description: 'Verbose'
    default: 'false'
  config-file:
    required: false
    description: 'Config file'
  create-commit:
    required: false
    description: 'Create a commit after merging the JSON files'
    default: 'true'
  post-merge-node-script:
    required: false
    description: 'Path to a Node.js script to run after merging and before committing (relative to the repo root)'
  post-merge-script:
    required: false
    description: 'Shell command to run after merging and before committing'
  post-merge-command:
    required: false
    description: 'Alias for post-merge-script'
  postMergeCommand:
    required: false
    description: 'Alias for post-merge-script'
  post-merge-script-command-continue-on-error:
    required: false
    description: 'Continue the action when the post-merge script or command fails'
    default: 'false'
  postMergeScriptCommandContinueOnError:
    required: false
    description: 'Alias for post-merge-script-command-continue-on-error'
    default: 'false'

outputs:
  hasConflict:
    description: 'Whether the merge process has conflicts'
    value: ${{ steps.merge-json.outputs.hasConflict }}
  hasErrors:
    description: 'Whether the merge process has errors'
    value: ${{ steps.merge-json.outputs.hasErrors }}
  error:
    description: 'The error message'
    value: ${{ steps.merge-json.outputs.error }}
  hasCommitted:
    description: 'Whether the merge process has committed'
    value: ${{ steps.merge-json.outputs.hasCommitted }}
  mergedFiles:
    description: 'The merged files'
    value: ${{ steps.merge-json.outputs.mergedFiles }}
  log:
    description: 'The output of the merge process'
    value: ${{ steps.merge-json.outputs.log }}

runs:
  using: 'composite'
  steps:
    - name: Select compatible Shopify CLI
      id: shopify-cli-version
      shell: bash
      if: ${{ inputs.check-json-validity == 'true' }}
      run: |
        # Both pins retain the JSON contract consumed by the bundled merger.
        node <<'NODE' >> "$GITHUB_OUTPUT"
        const [major, minor] = process.versions.node.split('.').map(Number);
        let version;
        if (major > 22 || (major === 22 && minor >= 12)) {
          version = '4.9.4';
        } else if (
          (major === 18 && minor >= 20) ||
          (major === 20 && minor >= 10) ||
          major === 21 || major === 22
        ) {
          version = '3.70.0';
        } else {
          throw new Error(`Unsupported Node ${process.versions.node}: use Node 18.20.x or Node 20.10+.`);
        }
        console.log(`version=${version}`);
        console.log(`node-major=${major}`);
        NODE
        echo "$HOME/.npm-global-shopify/bin" >> "$GITHUB_PATH"

    - name: Cache Shopify CLI
      id: cache-shopify-cli
      if: ${{ inputs.check-json-validity == 'true' }}
      uses: actions/cache@v4
      with:
        path: ~/.npm-global-shopify
        key: shopify-cli-${{ runner.os }}-${{ runner.arch }}-node${{ steps.shopify-cli-version.outputs.node-major }}-${{ steps.shopify-cli-version.outputs.version }}-v2

    - name: Install Shopify CLI
      shell: bash
      if: ${{ inputs.check-json-validity == 'true' }}
      env:
        EXPECTED_SHOPIFY_CLI_VERSION: ${{ steps.shopify-cli-version.outputs.version }}
      run: |
        cli_prefix="$HOME/.npm-global-shopify"
        verify_cli() {
          node - "$cli_prefix" "$EXPECTED_SHOPIFY_CLI_VERSION" <<'NODE'
        const fs = require('node:fs');
        const path = require('node:path');
        try {
          const [prefix, expected] = process.argv.slice(2);
          const root = path.join(prefix, 'lib', 'node_modules', '@shopify', 'cli');
          const metadata = require(path.join(root, 'package.json'));
          const executable = path.join(prefix, 'bin', 'shopify');
          const target = typeof metadata.bin === 'string' ? metadata.bin : metadata.bin.shopify;
          fs.accessSync(executable, fs.constants.X_OK);
          if (metadata.version !== expected || fs.realpathSync(executable) !== fs.realpathSync(path.join(root, target))) {
            process.exit(1);
          }
        } catch {
          process.exit(1);
        }
        NODE
        }
        if ! verify_cli; then
          npm install -g --prefix "$cli_prefix" "@shopify/cli@$EXPECTED_SHOPIFY_CLI_VERSION"
          if ! verify_cli; then
            echo "::error::Shopify CLI installation does not match $EXPECTED_SHOPIFY_CLI_VERSION."
            exit 1
          fi
        fi
        echo "Using Shopify CLI $EXPECTED_SHOPIFY_CLI_VERSION from $cli_prefix."

    - name: Print out the current directory
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
      run: |
        pwd
        echo $GITHUB_ACTION_PATH

    - name: Setup git
      if: ${{ inputs.config-git-user == 'true' }}
      shell: bash
      run: |
        git config --local user.name github-actions
        git config --local user.email github-actions@github.com

    - name: Create local tracking branches for merger
      shell: bash
      env:
        PRODUCTION_BRANCH: ${{ inputs.production-branch }}
        LIVE_MIRROR_BRANCH: ${{ inputs.live-mirror-branch }}
      run: |
        git branch "$PRODUCTION_BRANCH" "origin/$PRODUCTION_BRANCH" 2>/dev/null || true
        git branch "$LIVE_MIRROR_BRANCH" "origin/$LIVE_MIRROR_BRANCH" 2>/dev/null || true

    - name: Run the merge code
      id: merge-json
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        # Set the INPUT_ variables to the values of the action.yml inputs. These are not available in composite actions, so we have to pass them in manually.
        # https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#example-specifying-inputs
        INPUT_JSON_PATHS: ${{ inputs.json-paths }}
        INPUT_MAIN_BRANCH: ${{ inputs.main-branch }}
        INPUT_PRODUCTION_BRANCH: ${{ inputs.production-branch }}
        INPUT_LIVE_MIRROR_BRANCH: ${{ inputs.live-mirror-branch }}
        INPUT_CHECK_JSON_VALIDITY: ${{ inputs.check-json-validity }}
        INPUT_FORMATTER_COMMAND: ${{ inputs.formatter-command }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        INPUT_PREFERRED: ${{ inputs.preferred }}
        INPUT_EXIT_IF_NO_EXISTING_DEPLOYMENT: ${{ inputs.exit-if-no-existing-deployment }}
        INPUT_RUN_LOCALLY_ONLY: ${{ inputs.run-locally-only }}
        INPUT_CONFIG_GIT_USER: ${{ inputs.config-git-user }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_CREATE_COMMIT: ${{ inputs.create-commit }}
        INPUT_POST_MERGE_NODE_SCRIPT: ${{ inputs.post-merge-node-script }}
        INPUT_POST_MERGE_SCRIPT: ${{ inputs.post-merge-script }}
        INPUT_POST_MERGE_COMMAND: ${{ inputs.post-merge-command }}
        INPUT_POSTMERGECOMMAND: ${{ inputs.postMergeCommand }}
        INPUT_POST_MERGE_SCRIPT_COMMAND_CONTINUE_ON_ERROR: ${{ inputs.post-merge-script-command-continue-on-error }}
        INPUT_POSTMERGESCRIPTCOMMANDCONTINUEONERROR: ${{ inputs.postMergeScriptCommandContinueOnError }}
      run: |
        pwd
        node dist/index.js

    - name: Output the log
      shell: bash
      run: |
        echo "${{ steps.merge-json.outputs.log }}"

    - name: See the git status
      shell: bash
      run: |
        git status

    - name: Push the changes, if there are any
      shell: bash
      if: ${{ inputs.push-after-commit == 'true' && steps.merge-json.outputs.hasCommitted == 'true' }}
      run: |
        git status | grep 'Your branch is ahead' && git push && echo 'Pushed changes' || echo "No changes to push"
